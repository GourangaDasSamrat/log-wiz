name: Documentation Improvement
description: Report missing, unclear, or outdated documentation
title: "docs: "
labels: [documentation, needs-triage]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve the documentation!

        Before submitting:
        - Check the full [documentation site](https://GourangaDasSamrat.github.io/log-wiz-docs/)
        - Search [existing issues](https://github.com/GourangaDasSamrat/log-wiz/issues) for similar requests
        - Make sure this isn't already documented elsewhere

  - type: textarea
    id: doc-section
    attributes:
      label: Which documentation section needs improvement?
      description: |
        Provide a link or the title of the page/section
      placeholder: |
        Page: Getting Started
        URL: https://GourangaDasSamrat.github.io/log-wiz-docs/guides/getting-started/
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: Current State
      description: What does the documentation currently say (or not say)?
      placeholder: |
        The current documentation says...
        or
        This section is missing...
    validations:
      required: true

  - type: textarea
    id: suggested-improvement
    attributes:
      label: Suggested Improvement
      description: How should the documentation be improved?
      placeholder: |
        The documentation should:
        - Add an example showing...
        - Clarify that...
        - Update the code example to...
      render: markdown
    validations:
      required: true

  - type: textarea
    id: why-matters
    attributes:
      label: Why This Matters
      description: Help us prioritize by explaining the impact

  - type: checkboxes
    id: issue-type
    attributes:
      label: Issue Type
      options:
        - label: Clarity — Current docs are confusing or incomplete
        - label: Accuracy — Docs are outdated or incorrect
        - label: Missing Example — No example for this use case
        - label: Missing API Reference — A method/type is not documented
        - label: Getting Started — Onboarding is unclear
        - label: Other (describe above)

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked the full documentation site
          required: true
        - label: I have searched existing issues for similar requests
          required: true
        - label: This is not already documented elsewhere
          required: true
