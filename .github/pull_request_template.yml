name: Pull Request
description: Submit a change to log-wiz
title: ''
labels: []

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of your changes
    validations:
      required: true

  - type: checkboxes
    id: type-of-change
    attributes:
      label: Type of Change
      options:
        - label: 🐛 Bug fix (non-breaking change that fixes an issue)
        - label: ✨ New feature (non-breaking change that adds functionality)
        - label: 💔 Breaking change (fix or feature that would cause existing functionality to change)
        - label: 📖 Documentation update
        - label: ♻️ Refactoring (no functional changes)
        - label: ⚡ Performance improvement
        - label: 🧪 Test updates
    validations:
      required: true

  - type: input
    id: related-issue
    attributes:
      label: Related Issue
      description: Link to the issue this PR addresses (for example, `Closes #123`)
      placeholder: Closes #

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have read the [CONTRIBUTING.md](../docs/CONTRIBUTING.md) guidelines
          required: true
        - label: My code follows the project's coding standards
          required: true
        - label: I have performed a self-review of my own code
          required: true
        - label: I have added necessary comments/documentation
        - label: I have added tests for my changes (or updated existing tests)
        - label: My changes generate no new warnings or ESLint errors
          required: true
        - label: The PR title follows [Conventional Commits](https://www.conventionalcommits.org/) format
          required: true
        - label: All tests pass locally (`npm test`)
        - label: The build passes locally (`npm run build`)
        - label: I have verified this fix/feature works as intended
          required: true

  - type: textarea
    id: testing
    attributes:
      label: Testing
      description: Describe how you tested your changes
      placeholder: |
        npm test
      render: bash

  - type: textarea
    id: breaking-changes
    attributes:
      label: Breaking Changes
      description: If your PR introduces breaking changes, describe them here
      value: |
        - None

  - type: textarea
    id: additional-notes
    attributes:
      label: Additional Notes
      description: Add any other context, screenshots, or notes here
